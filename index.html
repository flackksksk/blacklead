<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--bg:#050505;--bg2:#0a0a0a;--bg3:#111;--fg:#fff;--mut:#8c8c8c;--sil:#c8c8c8;--ln:#242424;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.sc{font-weight:700;font-size:13px;border:1px solid #fff;border-radius:8px;padding:1px 7px}
.empty{text-align:center;color:var(--mut);padding:34px 14px;border:1px dashed #333;border-radius:14px}
.bar{display:grid;grid-template-columns:140px 1fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:12px;color:var(--sil)}
.bar div{height:8px;background:#1a1a1a;border-radius:9px;overflow:hidden}.bar div i{display:block;height:100%;background:linear-gradient(90deg,#555,#fff);border-radius:9px;transition:width .5s}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}.col{min-width:220px;width:220px}.col h3{font-size:12px;color:var(--mut);margin:0 0 8px;font-weight:600}
.col .card{margin-bottom:8px;cursor:pointer;padding:10px}
#modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.75);z-index:20;overflow:auto;padding:max(14px,env(safe-area-inset-top)) 14px 14px}
#modal.on{display:block}#modal .glow{max-width:680px;margin:20px auto;padding:20px;background:#0c0c0c;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw}
#toast.on{opacity:1}
table{width:100%;border-collapse:collapse}td{padding:8px 6px;border-top:1px solid var(--ln);vertical-align:top}
.ok{color:#fff}.no{color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#444}.dot.on{background:#fff;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tablewrap{overflow-x:auto}
@media(max-width:760px){#app{display:block}#nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;z-index:10;border-right:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.logo{display:none}#nav button span{display:none}main{padding-bottom:90px}.bar{grid-template-columns:100px 1fr 24px}}
.mapwrap{position:relative;height:calc(100vh - 200px);min-height:420px;padding:0;overflow:hidden;backdrop-filter:none;background:#050505}.mapwrap::before{z-index:4}
#mapel{position:absolute;inset:0;z-index:1}.maplibregl-map{position:relative;overflow:hidden}.maplibregl-canvas-container,.maplibregl-canvas{position:absolute;left:0;top:0}.maplibregl-canvas-container.maplibregl-interactive{cursor:grab;user-select:none}.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-drag-pan{touch-action:pan-x pan-y}.maplibregl-control-container{display:none}
.mctl{position:absolute;top:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:6px}.mcard{position:absolute;left:12px;bottom:12px;z-index:3;display:none;max-width:min(300px,calc(100% - 24px));background:rgba(10,10,10,.92);border:1px solid #fff;border-radius:12px;padding:12px}.mcred{position:absolute;right:8px;bottom:6px;z-index:3;font-size:10px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px}.mcred a{color:var(--sil)}.mmsg{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(5,5,5,.94);color:var(--sil)}
.mtip{position:absolute;z-index:6;display:none;pointer-events:none;background:rgba(10,10,10,.95);border:1px solid #555;border-radius:8px;padding:3px 8px;font:12px system-ui,sans-serif;color:#fff;white-space:nowrap}
.mbar{position:absolute;left:50%;top:14px;z-index:4;width:min(580px,calc(100% - 110px));transform:translate(-50%,-18px) scale(.96);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .35s}.mbar.on{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.mbi,.mrow{display:flex;gap:8px;align-items:center;background:rgba(24,24,24,.42);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.mbi{padding:8px;border-radius:18px}.mbi input{flex:1;min-width:0;background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.12);border-radius:12px}
.mrow{display:none;margin-top:8px;padding:7px 8px 7px 14px;border-radius:14px;font-size:12px;color:var(--sil);justify-content:space-between}
.mgo{position:relative;overflow:hidden;display:flex;gap:8px;align-items:center;white-space:nowrap;border:0;border-radius:12px;padding:10px 16px;background:#fff;color:#000;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .3s}
.mgo:hover{box-shadow:0 0 26px rgba(255,255,255,.5)}.mgo:active{transform:scale(.96)}.mgo:disabled{cursor:progress}
.mgo.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(0,0,0,.2) 50%,transparent 70%);animation:sweep 1.1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.msnd{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:.2s}.msnd:hover{background:rgba(255,255,255,.18)}.msnd.off{opacity:.4;text-decoration:line-through}
.mad{display:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}.mad:hover{background:#fff;color:#000}
.mradar{position:absolute;left:50%;top:50%;z-index:2;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .3s}.mradar.on{opacity:1}
.mradar::before,.mradar::after{content:"";position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;animation:ring 1.8s ease-out infinite}.mradar::after{animation-delay:.9s}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(2.6);opacity:0}}

:root{--bg:#08090C;--bg2:#0C0D12;--bg3:#12131A;--bg4:#191A22;--fg:#F4F4F5;--mut:#92939D;--sil:#C9CAD1;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.15);--red:#C62838;--red2:#E34B58;--redS:rgba(198,40,56,.12);--rg:rgba(198,40,56,.25);--glass:rgba(20,21,28,.72)}

.btn.p{background:var(--red);border-color:var(--red2);color:#fff}.btn.p:hover{background:var(--red2);box-shadow:0 0 22px var(--rg)}.btn:hover{border-color:var(--red2)}
.sc{border-color:rgba(227,75,88,.6);color:#FFD9DC}.bar div i{background:linear-gradient(90deg,#5a1a22,var(--red2))}.dot.on{background:var(--red2)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline-color:var(--red2)}
.mapwrap{background:var(--bg)}.mgo{background:var(--red);color:#fff}.mgo:hover{box-shadow:0 0 26px var(--rg)}.mad:hover{background:var(--red);color:#fff;border-color:var(--red2)}
.mcard{border-color:rgba(227,75,88,.55);background:rgba(18,19,26,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mradar{display:none!important}.rdc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.mapwrap{background:#07080B}
.mhud{position:absolute;right:12px;bottom:30px;z-index:4;min-width:190px;padding:10px 14px;border-radius:14px;background:rgba(18,19,26,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln2);box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:11px;line-height:1.7;color:var(--mut)}
.mhud b{float:right;margin-left:14px;color:var(--fg);font-weight:500}.hs{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--fg);font-weight:600;font-size:12px}
.hd{width:7px;height:7px;border-radius:50%;background:#555}.hd.on{background:var(--red2);animation:pulse 1.4s ease-in-out infinite}

.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 4px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--sil);font:inherit;font-size:12px;cursor:pointer}.seg button.on{border-color:var(--red2);background:var(--redS);color:#fff}
input[type=range]{padding:0;accent-color:var(--red2)}

<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const ST=["Encontrada","Em análise","Qualificada","Primeiro contato","Aguardando resposta","Respondeu","Proposta enviada","Em negociação","Cliente conquistado","Perdida","Não contatar"];
const SITE={sim:"Site confirmado",nao:"Site não localizado após pesquisa",nv:"Site não verificado",off:"Site aparentemente indisponível"};
const W0={nao:35,nv:10,ig:10,rt:20,rv:15,ph:10};
const WL={nao:"Site não localizado após pesquisa",nv:"Site não verificado ou indisponível",ig:"Sem Instagram identificado",rt:"Avaliação ≥ 4,3",rv:"30 avaliações ou mais",ph:"Telefone disponível para contato"};
const $=s=>document.querySelector(s);
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(){try{localStorage.setItem("bl.leads",JSON.stringify(L));localStorage.setItem("bl.w",JSON.stringify(W))}catch(e){}}
let L=ld("bl.leads",[]),W=Object.assign({},W0,ld("bl.w",{})),V="overview",Q=null,M=null,G={ch:"WhatsApp",sv:"Criação de site institucional",tn:"Natural",ob:"Primeiro contato",ln:"Médio"},DEL=false;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opt=(a,v)=>a.map(x=>`<option${x==v?" selected":""}>${esc(x)}</option>`).join("");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
function score(l){const p=[],a=(k,c)=>{if(c)p.push([WL[k],W[k]])};
a("nao",l.site=="nao");a("nv",l.site=="nv"||l.site=="off");a("ig",!l.ig);a("rt",+l.rating>=4.3);a("rv",+l.reviews>=30);a("ph",!!l.phone);
return{v:Math.min(100,p.reduce((s,x)=>s+x[1],0)),p}}
const render=()=>{
$("#nav").innerHTML='<div class="logo">BLACK<b>LEAD</b></div>'+[["overview","Overview","◉"],["empresas","Empresas","⌕"],["leads","Leads","▤"],["mapa","Mapa","◍"],["config","Configurações","⚙"]].map(([k,n,i])=>`<button data-a="go" data-k="${k}" class="${V==k?"on":""}"><i>${i}</i><span>${n}</span></button>`).join("")+'<button class="aubtn'+(AU.mode!=='off'?' on':'')+'" data-a="aup" aria-label="Áudio e efeitos" title="Áudio e efeitos"><i>♪</i><span>Áudio</span></button>';
$("#main").innerHTML={overview,empresas,leads,mapa,config}[V]();if(V=="mapa")mapMount()};
function overview(){
const n=L.length,c=f=>L.filter(f).length,ct=c(l=>l.stage>=3&&l.stage<=8),cl=c(l=>l.stage==8);
const K=[["Empresas cadastradas",n],["Sem site localizado",c(l=>l.site=="nao")],["Com site confirmado",c(l=>l.site=="sim")],["Presença digital fraca",c(l=>score(l).v>=60)],["Ainda não contatadas",c(l=>l.stage<=2)],["Já contatadas",ct],["Respostas recebidas",c(l=>l.stage>=5&&l.stage<=8)],["Propostas enviadas",c(l=>l.stage>=6&&l.stage<=8)],["Em negociação",c(l=>l.stage==7)],["Clientes conquistados",cl],["Conversão (clientes ÷ contatadas)",ct?Math.round(cl/ct*100)+"%":"—"]];
let h='<h1>Overview</h1><p class="sub">Indicadores calculados apenas com as empresas que você cadastrou ou importou neste navegador.</p>';
if(!n)return h+'<div class="empty glow" style="padding:40px"><h2>Nenhuma empresa cadastrada</h2>Comece em <b>Empresas</b>: cadastre uma empresa à mão ou importe um CSV. O dashboard se preenche sozinho.<div style="margin-top:14px"><button class="btn p" data-a="go" data-k="empresas">Cadastrar primeira empresa</button></div></div>';
h+='<div class="grid">'+K.map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")+"</div>";
const mx=Math.max(1,...ST.map((s,i)=>c(l=>l.stage==i)));
h+='<div class="glow panel" style="margin-top:18px"><h2>Funil comercial</h2>'+ST.map((s,i)=>{const v=c(l=>l.stage==i);return`<div class="bar"><span>${s}</span><div><i style="width:${v/mx*100}%"></i></div><span>${v}</span></div>`}).join("")+"</div>";
const top=[...L].sort((a,b)=>score(b).v-score(a).v).slice(0,5);
h+='<div class="panel card"><h2>Oportunidades com maior pontuação</h2>'+top.map(l=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--ln)"><a href="#" data-a="open" data-id="${l.id}" style="color:#fff">${esc(l.name)}</a><span class="sc">${score(l).v}</span></div>`).join("")+"</div>";
const fu=L.filter(l=>l.next).sort((a,b)=>a.next>b.next?1:-1).slice(0,5);
if(fu.length)h+='<div class="panel card"><h2>Próximos follow-ups</h2>'+fu.map(l=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--ln)"><a href="#" data-a="open" data-id="${l.id}" style="color:#fff">${esc(l.name)}</a><span class="${l.next<new Date().toISOString().slice(0,10)?"ok":"no"}">${esc(l.next)}${l.next<new Date().toISOString().slice(0,10)?" · vencido":""}</span></div>`).join("")+"</div>";
return h}
function lcard(l){const s=score(l);return`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(l.name)}</b><span class="sc" title="Opportunity Score">${s.v}</span></div><div class="no">${esc(l.cat)||"Sem categoria"} · ${esc(l.city)}${l.uf?"/"+esc(l.uf):""}</div><div class="row" style="margin:8px 0"><span class="tag">${SITE[l.site]}</span>${l.rating?`<span class="tag">★ ${esc(l.rating)} (${esc(l.reviews||0)})</span>`:""}</div><div class="no">${esc(l.phone)||"Telefone não informado"}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-a="open" data-id="${l.id}">Detalhes</button><button class="btn sm" data-a="fav" data-id="${l.id}">${l.fav?"★ Favorita":"☆ Favoritar"}</button></div></div>`}
function empresas(){
let res="";
if(Q){const m=(a,b)=>!b||String(a).toLowerCase().includes(b.toLowerCase());const r=L.filter(l=>m(l.cat,Q.cat)&&m(l.city,Q.city)&&m(l.uf,Q.uf)&&(!Q.kw||m(l.name+" "+l.cat+" "+(l.notes||""),Q.kw)));
res=remotePanel()+`<div class="panel card"><h2>Resultados na sua base (${r.length})</h2><p class="no" style="margin-top:0">Empresas já salvas na sua base que correspondem à pesquisa.</p>${r.length?'<div class="cards">'+r.map(lcard).join("")+"</div>":'<div class="empty">Nenhuma empresa na base corresponde a esta pesquisa.</div>'}</div>`}
const UF="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");

function snd(k,at){if(AU.mode==='off')return;const c=auInit();if(!c)return;if(c.state==='suspended')c.resume();const t=Math.max(at||0,c.currentTime+.02);if(k==='pulse')bass(t,55,1.9,.9);else if(k==='go')swell(t);else if(k==='select'){bass(t,64,.6,.7);blip(t+.03,520,.12,.05)}else if(k==='ok'){blip(t,700,.09,.03);bass(t+.2,50,1,.35);blip(t+.3,330,.5,.04)}else if(k==='tick')blip(t,480,.08,.025);else if(k==='err')blip(t,220,.3,.05)}
const RD={cv:null,x:null,w:[],on:0,raf:0,next:0,nd:-1,ctr:null,sel:'',dpr:1};
function rdSize(){if(!RD.cv||!mpEl)return;const r=mpEl.getBoundingClientRect(),d=RD.dpr=Math.min(devicePixelRatio||1,2);RD.cv.width=Math.round(r.width*d);RD.cv.height=Math.round(r.height*d)}
function rdInit(){if(RD.cv||!mpEl)return;const c=document.createElement('canvas');c.className='rdc';c.setAttribute('aria-hidden','true');mpEl.appendChild(c);RD.cv=c;RD.x=c.getContext('2d');rdSize();mp.on('resize',rdSize)}
const rdNow=()=>AU.ctx&&AU.ctx.state==='running'&&AU.mode!=='off'?[AU.ctx.currentTime,1]:[performance.now()/1000,0];
function rdPush(lng,lat,full,dur){const n=rdNow(),t0=n[0]+.06;RD.w.push({lng:lng,lat:lat,t0:t0,ac:n[1],dur:dur||2.1,full:full});rdLoop();snd(full?'pulse':'select',n[1]?t0:0)}
function rdDraw(){const x=RD.x,c=RD.cv,d=RD.dpr;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,c.width,c.height);const W=c.width/d,H=c.height/d,T=6.2832;
RD.w=RD.w.filter(w=>{const now=w.ac?AU.ctx.currentTime:performance.now()/1000,k=(now-w.t0)/w.dur;if(k>=1)return false;if(k<0)return true;const p=mp.project([w.lng,w.lat]),mx=Math.hypot(Math.max(p.x,W-p.x),Math.max(p.y,H-p.y)),e=1-Math.pow(1-k,2.2),r=RM.matches?34+e*10:Math.max(2,e*mx*(w.full?1:.45)),a=Math.pow(1-k,1.5);
const g=x.createRadialGradient(p.x,p.y,r*.55,p.x,p.y,r);g.addColorStop(0,'rgba(198,40,56,0)');g.addColorStop(.85,'rgba(198,40,56,'+.07*a+')');g.addColorStop(1,'rgba(227,75,88,'+.22*a+')');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,r,0,T);x.fill();
x.lineWidth=7;x.strokeStyle='rgba(198,40,56,'+.07*a+')';x.beginPath();x.arc(p.x,p.y,r,0,T);x.stroke();x.lineWidth=1.5;x.strokeStyle='rgba(227,75,88,'+.7*a+')';x.beginPath();x.arc(p.x,p.y,r,0,T);x.stroke();
const ca=Math.max(0,1-k*2.2);if(ca>0){const cg=x.createRadialGradient(p.x,p.y,0,p.x,p.y,26);cg.addColorStop(0,'rgba(255,214,218,'+.9*ca+')');cg.addColorStop(.35,'rgba(227,75,88,'+.5*ca+')');cg.addColorStop(1,'rgba(198,40,56,0)');x.fillStyle=cg;x.beginPath();x.arc(p.x,p.y,26,0,T);x.fill()}
if(!RM.matches&&k<.7&&W>760){x.fillStyle='rgba(255,170,178,'+.5*a+')';for(let i=0;i<14;i++){const th=i*.4488+w.t0*3.1,rr=r*(.96+.04*Math.sin(i*5.3));x.beginPath();x.arc(p.x+Math.cos(th)*rr,p.y+Math.sin(th)*rr,1.2,0,T);x.fill()}}return true})}
function rdLoop(){if(RD.raf||!RD.cv)return;const f=()=>{RD.raf=0;if(document.hidden){RD.raf=requestAnimationFrame(f);return}if(RD.on){const n=rdNow();if(n[1]!==RD.nd){RD.nd=n[1];RD.next=0}if(n[0]>=RD.next){RD.next=n[0]+2.4;rdPush(RD.ctr.lng,RD.ctr.lat,1)}}rdDraw();if(RD.on||RD.w.length)RD.raf=requestAnimationFrame(f);else RD.x.clearRect(0,0,RD.cv.width,RD.cv.height)};RD.raf=requestAnimationFrame(f)}
function radarStart(){if(!mp)return;rdInit();if(!RD.cv)return;RD.ctr=mp.getCenter();RD.next=0;RD.nd=-1;if(RM.matches){rdPush(RD.ctr.lng,RD.ctr.lat,1)}else{RD.on=1;rdLoop()}}
function radarStop(){RD.on=0}
function radarOnce(p){rdInit();if(RD.cv)rdPush(p[0],p[1],0,1.6)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]'),a=t&&t.dataset.a,p=$('#aup');
if(a==='aup'){auUI().classList.toggle('on');return}
if(a==='aum'){AU.mode=t.dataset.m;try{localStorage.setItem('bl.am',JSON.stringify(AU.mode))}catch(x){}if(AU.mode!=='off'){auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();auGain();snd('pulse')}else auGain();auUI();const b=$('.aubtn');if(b)b.classList.toggle('on',AU.mode!=='off');return}
if(a==='aud'){if(AU.mode==='off')toast('Ative o áudio em Discreto ou Imersivo');else snd('pulse');return}
if(p&&p.classList.contains('on')&&!e.target.closest('#aup'))p.classList.remove('on')});
